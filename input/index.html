<!DOCTYPE html>
<html>

<body>
    <h2>Form Input</h2>
    <form action="input.php" onsubmit="return validateForm()" method="post">
        <label for="kecamatan">Kecamatan:</label><br>
        <input type="text" id="kec" name="kecamatan" value=""><br>
        <label for="kecamatan">Longitude:</label><br>
        <input type="text" id="long" name="longitude" value=""><br>
        <label for="kecamatan">Latitude:</label><br>
        <input type="text" id="lat" name="latitude" value=""><br>
        <label for="nama">nama:</label><br>
        <input type="text" id="nama" name="nama" value=""><br>
        <label for="pemilik">pemilik:</label><br>
        <input type="text" id="pemilik" name="pemilik" value=""><br><br>
        <input type="submit" value="Submit">
    </form>
    <p id="informasi"></p>
    <script>
        function validateForm() {

            let luas = document.getElementById("luas").value;
            let text = "";
            if (isNaN(luas) || luas < 1) {
                text = "Data luas harus angka dan tidak boleh bernilai negatif";
                // stop the form submission
                event.preventDefault();
            }
            document.getElementById("informasi").innerHTML = text;
        }
    </script>
</body>

</html>
